name: stats

on:
  schedule:
    - cron: "17 */6 * * *" # four times a day: 00:17, 06:17, 12:17, 18:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the stats card
        run: node scripts/stats.mjs
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-light.svg assets/stats-dark.svg
          git diff --cached --quiet || git commit -m "Update stats" && git push
